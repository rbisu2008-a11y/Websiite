<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula Notes — Your Creative Thinking Space</title>
  <style>
    :root {
      --bg: #0e1120;
      --surface: #161b2f;
      --surface-2: #1f2540;
      --text: #f3f6ff;
      --muted: #aeb7d5;
      --accent: #7c8dff;
      --accent-2: #4cf3c4;
      --danger: #ff7a9b;
      --warning: #fcd45e;
      --shadow: 0 20px 40px rgba(7, 11, 30, 0.45);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #2a3262 0%, transparent 30%),
        radial-gradient(circle at 90% 10%, #13466f 0%, transparent 35%),
        radial-gradient(circle at 50% 100%, #233464 0%, transparent 40%),
        var(--bg);
      color: var(--text);
      padding: 22px;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
      grid-template-columns: 360px 1fr;
    }

    .panel {
      background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .left, .right {
      padding: 18px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: var(--surface);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stat b {
      display: block;
      font-size: 1.1rem;
    }

    label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    input, textarea, select, button {
      font: inherit;
      border: none;
      outline: none;
      color: inherit;
      border-radius: 12px;
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 11px 12px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.4;
    }

    .row {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }

    .btn {
      cursor: pointer;
      background: linear-gradient(130deg, var(--accent), var(--accent-2));
      color: #0f1324;
      font-weight: 700;
      padding: 11px 14px;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.04); }

    .btn.alt {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      font-weight: 500;
    }

    .btn.danger { background: linear-gradient(130deg, #ff8fb0, #ff6b8e); }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(124, 141, 255, 0.18);
      border: 1px solid rgba(124, 141, 255, 0.45);
      color: #dbe1ff;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .chip.active {
      background: rgba(76, 243, 196, 0.22);
      border-color: rgba(76, 243, 196, 0.6);
      color: #d8fff5;
    }

    .list {
      display: grid;
      gap: 10px;
      max-height: 72vh;
      overflow: auto;
      padding-right: 4px;
    }

    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      display: grid;
      gap: 8px;
      cursor: pointer;
    }

    .card.active {
      border-color: rgba(76, 243, 196, 0.8);
      box-shadow: inset 0 0 0 1px rgba(76, 243, 196, 0.35);
    }

    .card h3 {
      margin: 0;
      font-size: 1.02rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .muted { color: var(--muted); font-size: 0.84rem; }

    .priority {
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(252, 212, 94, 0.2);
      color: #ffe49b;
      border: 1px solid rgba(252, 212, 94, 0.45);
      text-transform: capitalize;
    }

    .priority.low { background: rgba(124,141,255,0.2); color: #cfd6ff; border-color: rgba(124,141,255,0.45); }
    .priority.high { background: rgba(255,122,155,0.2); color: #ffc2d2; border-color: rgba(255,122,155,0.45); }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag {
      font-size: 0.73rem;
      border-radius: 999px;
      padding: 3px 7px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,0.2);
      padding: 24px 12px;
    }

    .footer-note {
      color: var(--muted);
      font-size: 0.79rem;
      text-align: center;
      margin-top: 6px;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .list { max-height: 45vh; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel left">
      <div>
        <h1>✨ Nebula Notes</h1>
        <p class="subtitle">Not just notes — a focus cockpit with memory, mood, and momentum.</p>
      </div>

      <div class="stats">
        <div class="stat"><b id="statNotes">0</b><small>Total</small></div>
        <div class="stat"><b id="statPinned">0</b><small>Pinned</small></div>
        <div class="stat"><b id="statWords">0</b><small>Words</small></div>
      </div>

      <div>
        <label for="search">Search your universe</label>
        <div class="search-wrap">
          <input id="search" placeholder="Find by title, text, or tag..." />
          <button class="btn alt" id="clearSearch">Clear</button>
        </div>
      </div>

      <div>
        <label>Smart filters</label>
        <div class="chip-group" id="filterChips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="pinned">Pinned</button>
          <button class="chip" data-filter="high">High</button>
          <button class="chip" data-filter="today">Today</button>
        </div>
      </div>

      <div class="list" id="notesList"></div>
      <p class="footer-note">Everything auto-saves locally in your browser.</p>
    </section>

    <section class="panel right">
      <div>
        <label for="title">Title</label>
        <input id="title" placeholder="e.g., Launch campaign ideas" />
      </div>

      <div>
        <label for="content">Note body</label>
        <textarea id="content" placeholder="Capture ideas, tasks, snippets, reflections..."></textarea>
      </div>

      <div class="row">
        <div>
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label for="mood">Mood theme</label>
          <select id="mood">
            <option value="focus">Focus Blue</option>
            <option value="calm">Calm Mint</option>
            <option value="energy">Energy Sunset</option>
            <option value="midnight">Midnight Neon</option>
          </select>
        </div>
      </div>

      <div>
        <label for="tags">Tags (comma separated)</label>
        <input id="tags" placeholder="work, ideas, personal" />
      </div>

      <div class="toolbar">
        <button class="btn" id="saveBtn">Save note</button>
        <button class="btn alt" id="pinBtn">Pin/Unpin</button>
        <button class="btn alt" id="newBtn">New note</button>
        <button class="btn alt" id="exportBtn">Export JSON</button>
        <button class="btn danger" id="deleteBtn">Delete</button>
      </div>

      <div class="muted" id="insight">Start writing. Nebula will show live insight here.</div>
    </section>
  </main>

  <script>
    const storeKey = 'nebula-notes-v1';

    const els = {
      notesList: document.getElementById('notesList'),
      title: document.getElementById('title'),
      content: document.getElementById('content'),
      priority: document.getElementById('priority'),
      mood: document.getElementById('mood'),
      tags: document.getElementById('tags'),
      search: document.getElementById('search'),
      insight: document.getElementById('insight'),
      statNotes: document.getElementById('statNotes'),
      statPinned: document.getElementById('statPinned'),
      statWords: document.getElementById('statWords')
    };

    const state = {
      notes: JSON.parse(localStorage.getItem(storeKey) || '[]'),
      selectedId: null,
      search: '',
      filter: 'all'
    };

    function uid() {
      return Math.random().toString(36).slice(2, 11);
    }

    function nowISODate() {
      return new Date().toISOString();
    }

    function saveStore() {
      localStorage.setItem(storeKey, JSON.stringify(state.notes));
    }

    function setTheme(mood) {
      const map = {
        focus: ['#7c8dff', '#4cf3c4'],
        calm: ['#77e9cb', '#6eb5ff'],
        energy: ['#ff9d6c', '#f4ec74'],
        midnight: ['#b57cff', '#69f0ff']
      };
      const [a, b] = map[mood] || map.focus;
      document.documentElement.style.setProperty('--accent', a);
      document.documentElement.style.setProperty('--accent-2', b);
    }

    function parseTags(str) {
      return str.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    }

    function words(text) {
      return (text.trim().match(/\S+/g) || []).length;
    }

    function todayDateString() {
      return new Date().toISOString().slice(0, 10);
    }

    function getFilteredNotes() {
      const q = state.search.toLowerCase().trim();
      const filtered = state.notes.filter(note => {
        const blob = `${note.title} ${note.content} ${(note.tags || []).join(' ')}`.toLowerCase();
        const matchSearch = !q || blob.includes(q);

        let matchFilter = true;
        if (state.filter === 'pinned') matchFilter = note.pinned;
        if (state.filter === 'high') matchFilter = note.priority === 'high';
        if (state.filter === 'today') matchFilter = note.updatedAt.slice(0, 10) === todayDateString();

        return matchSearch && matchFilter;
      });

      return filtered.sort((a, b) => Number(b.pinned) - Number(a.pinned) || new Date(b.updatedAt) - new Date(a.updatedAt));
    }

    function updateStats() {
      const totalWords = state.notes.reduce((acc, n) => acc + words(`${n.title} ${n.content}`), 0);
      els.statNotes.textContent = state.notes.length;
      els.statPinned.textContent = state.notes.filter(n => n.pinned).length;
      els.statWords.textContent = totalWords;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderList() {
      const list = getFilteredNotes();
      if (!list.length) {
        els.notesList.innerHTML = `<div class="empty">No notes found. Try a different filter, or create one magical idea ✨</div>`;
        return;
      }

      els.notesList.innerHTML = list.map(note => `
        <article class="card ${note.id === state.selectedId ? 'active' : ''}" data-id="${note.id}">
          <h3>
            <span>${escapeHtml(note.title || 'Untitled note')}</span>
            <span class="priority ${note.priority}">${note.priority}</span>
          </h3>
          <div class="muted">${escapeHtml(note.content.slice(0, 110) || 'No content yet.')}${note.content.length > 110 ? '…' : ''}</div>
          <div class="tags">${(note.tags || []).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>
          <div class="muted">${note.pinned ? '📌 Pinned · ' : ''}Updated ${formatDate(note.updatedAt)}</div>
        </article>
      `).join('');

      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => loadNote(card.dataset.id));
      });
    }

    function escapeHtml(str) {
      return str
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function setInsight(text) {
      els.insight.textContent = text;
    }

    function loadNote(id) {
      const note = state.notes.find(n => n.id === id);
      if (!note) return;
      state.selectedId = id;
      els.title.value = note.title;
      els.content.value = note.content;
      els.priority.value = note.priority;
      els.mood.value = note.mood || 'focus';
      els.tags.value = (note.tags || []).join(', ');
      setTheme(els.mood.value);
      setInsight(`Loaded "${note.title || 'Untitled note'}" · ${words(note.content)} words · ${note.pinned ? 'Pinned' : 'Not pinned'}`);
      renderList();
    }

    function clearEditor(message = 'Ready for your next brilliant thought.') {
      state.selectedId = null;
      els.title.value = '';
      els.content.value = '';
      els.priority.value = 'medium';
      els.mood.value = 'focus';
      els.tags.value = '';
      setTheme('focus');
      setInsight(message);
      renderList();
    }

    function upsertNote() {
      const payload = {
        title: els.title.value.trim(),
        content: els.content.value.trim(),
        priority: els.priority.value,
        mood: els.mood.value,
        tags: parseTags(els.tags.value)
      };

      if (!payload.title && !payload.content) {
        setInsight('Give your note at least a title or some content first.');
        return;
      }

      if (state.selectedId) {
        const note = state.notes.find(n => n.id === state.selectedId);
        Object.assign(note, payload, { updatedAt: nowISODate() });
        setInsight(`Updated "${note.title || 'Untitled note'}" successfully.`);
      } else {
        const note = {
          id: uid(),
          ...payload,
          pinned: false,
          createdAt: nowISODate(),
          updatedAt: nowISODate()
        };
        state.notes.push(note);
        state.selectedId = note.id;
        setInsight(`Saved new note "${note.title || 'Untitled note'}".`);
      }

      saveStore();
      updateStats();
      renderList();
    }

    function deleteSelected() {
      if (!state.selectedId) {
        setInsight('Select a note to delete.');
        return;
      }
      const existing = state.notes.find(n => n.id === state.selectedId);
      state.notes = state.notes.filter(n => n.id !== state.selectedId);
      saveStore();
      updateStats();
      clearEditor(`Deleted "${existing?.title || 'Untitled note'}".`);
    }

    function togglePin() {
      if (!state.selectedId) {
        setInsight('Select a note to pin or unpin.');
        return;
      }
      const note = state.notes.find(n => n.id === state.selectedId);
      note.pinned = !note.pinned;
      note.updatedAt = nowISODate();
      saveStore();
      updateStats();
      renderList();
      setInsight(`${note.pinned ? 'Pinned' : 'Unpinned'} "${note.title || 'Untitled note'}".`);
    }

    function exportNotes() {
      const data = JSON.stringify(state.notes, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nebula-notes-${todayDateString()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      setInsight('Exported your notes to JSON.');
    }

    document.getElementById('saveBtn').addEventListener('click', upsertNote);
    document.getElementById('newBtn').addEventListener('click', () => clearEditor());
    document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
    document.getElementById('pinBtn').addEventListener('click', togglePin);
    document.getElementById('exportBtn').addEventListener('click', exportNotes);

    document.getElementById('clearSearch').addEventListener('click', () => {
      state.search = '';
      els.search.value = '';
      renderList();
    });

    els.search.addEventListener('input', (e) => {
      state.search = e.target.value;
      renderList();
    });

    els.mood.addEventListener('change', (e) => setTheme(e.target.value));

    document.querySelectorAll('#filterChips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        state.filter = chip.dataset.filter;
        document.querySelectorAll('#filterChips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderList();
      });
    });

    els.content.addEventListener('input', () => {
      const count = words(els.content.value);
      setInsight(`Live: ${count} words · ${Math.max(1, Math.ceil(count / 200))} min read · Keep going.`);
    });

    // Seed example notes to showcase the unique app on first open.
    if (!state.notes.length) {
      state.notes = [
        {
          id: uid(),
          title: 'Idea Orbit: Product Launch',
          content: 'Run a 5-day teaser with one cinematic short per day. Each short hints a hidden feature and links to a waitlist puzzle.',
          priority: 'high',
          mood: 'energy',
          tags: ['work', 'launch', 'creative'],
          pinned: true,
          createdAt: nowISODate(),
          updatedAt: nowISODate()
        },
        {
          id: uid(),
          title: 'Personal Reflection',
          content: 'I produce better work when I define the emotional goal first. For tomorrow: start every task with "How should this feel for people?"',
          priority: 'medium',
          mood: 'calm',
          tags: ['personal', 'growth'],
          pinned: false,
          createdAt: nowISODate(),
          updatedAt: nowISODate()
        }
      ];
      saveStore();
    }

    updateStats();
    renderList();
    if (state.notes[0]) loadNote(state.notes[0].id);
  </script>
</body>
</html>
